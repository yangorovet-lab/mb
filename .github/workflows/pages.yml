name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/epic-lovelace-vua5k7', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Настроить Pages (включает сайт, если ещё не включён)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Собрать артефакт (статика без сборки)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Задеплоить
        id: deployment
        uses: actions/deploy-pages@v4
